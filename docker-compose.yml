# Vokabeltrainer auf dem Familienserver.
#
#   cd /srv/vokabeltrainer && docker compose up -d
#
# Port 8030. Belegt sind: 80 und 8020 (Caddy — Startseite und der
# Autodesk-Spiegel), 2283 (Immich), 8010 (Paperless), 9925 (Mealie),
# 2019 (Caddy-Verwaltung), 2222 (zweiter SSH).
#
# Die Datenbank liegt unter /srv/vokabeltrainer/daten und wird damit von
# der bestehenden /srv-Sicherung mitgenommen. Siehe aber den Hinweis zur
# WAL-Datei in der README: für eine konsistente Sicherung gehört
# werkzeuge/sicherung.sh davor.

services:
  vokabeltrainer:
    build: .
    image: vokabeltrainer:neuste
    container_name: vokabeltrainer
    restart: unless-stopped
    ports:
      - "8030:8030"
    # Als der Benutzer laufen, dem ./daten gehört. Das Abbild legt zwar einen
    # eigenen Benutzer an, aber die eingehängte Verzeichnis bringt die Rechte
    # des Wirts mit — und so kommt man auch von der Kommandozeile ohne sudo
    # an die Datenbank. Bei einem anderen Wirt: `id -u`:`id -g` einsetzen.
    user: "1000:1000"
    volumes:
      - ./daten:/daten
    environment:
      - TZ=Europe/Berlin
      # Team-Kennung von Cloudflare Access. NUR wenn sie gesetzt ist, wird
      # die Kopfzeile mit der geprüften Mailadresse überhaupt angesehen —
      # sonst könnte im Heimnetz jemand sie selbst mitschicken und sich
      # ausgeben. Leer lassen, solange nur das Heimnetz zugreift.
      - VOKABEL_ACCESS_TEAM=${VOKABEL_ACCESS_TEAM:-}
      # Unter welcher Adresse die MCP-Schnittstelle von außen erreichbar
      # ist. Nur für die Anleitung im Tool — sie soll die richtige Adresse
      # zum Abschreiben zeigen statt eines Platzhalters. Gehört in die
      # .env und nicht hierher: die Adresse ist privat.
      - VOKABEL_MCP_URL=${VOKABEL_MCP_URL:-}
      # Die Adresse der Oberfläche von außen — die, hinter der Cloudflare
      # Access steht. Nur für OAuth gebraucht: der Schritt, in dem ein
      # Mensch einwilligt, muss hinter einer Anmeldung liegen. Ist sie
      # nicht gesetzt, bietet der Trainer gar kein OAuth an, statt einen
      # ungeschützten Endpunkt zu nennen.
      - VOKABEL_WEB_URL=${VOKABEL_WEB_URL:-}
