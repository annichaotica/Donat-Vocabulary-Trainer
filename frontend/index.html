<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Vokabeltrainer</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/css/stil.css">
</head>
<body>
<a class="sprungmarke" href="#inhalt">Zum Inhalt springen</a>

<header class="kopf" id="kopf" hidden>
  <button class="kopf-zurueck" id="zurueck" title="Zurück" aria-label="Zurück">‹</button>
  <div class="kopf-titel">
    <strong id="kopf-name">Vokabeltrainer</strong>
    <span id="kopf-zusatz" class="leise"></span>
  </div>
  <!-- Auf schmalen Geräten rückt diese Leiste per CSS an den unteren Rand:
       vier Knöpfe nebeneinander sprengen bei 360 px jede Kopfzeile, und unten
       sind sie mit dem Daumen erreichbar. Die Zeichen sind eingebettet, damit
       die Beschriftung bei kleiner Leiste nicht allein tragen muss. -->
  <nav class="kopf-knoepfe" aria-label="Hauptbereiche">
    <button data-ziel="#/uebersicht" title="Übersicht">
      <svg class="kopf-zeichen" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M3.5 10.6 12 3.8l8.5 6.8V20a1 1 0 0 1-1 1h-4.6v-6H9.1v6H4.5a1 1 0 0 1-1-1z"/>
      </svg>
      <span class="kopf-wort">Übersicht</span>
    </button>
    <button data-ziel="#/wortschatz" title="Wortschatz" id="knopf-wortschatz">
      <svg class="kopf-zeichen" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M9 6.5h11M9 12h11M9 17.5h11"/>
        <circle cx="4.5" cy="6.5" r="1.1" fill="currentColor" stroke="none"/>
        <circle cx="4.5" cy="12" r="1.1" fill="currentColor" stroke="none"/>
        <circle cx="4.5" cy="17.5" r="1.1" fill="currentColor" stroke="none"/>
      </svg>
      <span class="kopf-wort">Wortschatz</span>
    </button>
    <button data-ziel="#/einstellungen" title="Einstellungen" id="knopf-einstellungen">
      <svg class="kopf-zeichen" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M3.5 7.5h9M17 7.5h3.5M3.5 16.5h3.5M11.5 16.5h9"/>
        <circle cx="14.7" cy="7.5" r="2.3"/>
        <circle cx="9.2" cy="16.5" r="2.3"/>
      </svg>
      <span class="kopf-wort">Einstellungen</span>
    </button>
    <button id="knopf-profil" class="profil-knopf" title="Profil wechseln"></button>
  </nav>
</header>

<main id="inhalt" class="inhalt" tabindex="-1"></main>

<!-- AGPL §13: wer diese Fassung über das Netz benutzt, muss ihren
     Quelltext angeboten bekommen. Darum steht der Verweis hier und nicht
     nur in einer Datei im Repo. -->
<footer class="fusszeile">
  <a href="#/hilfe">Anleitung</a>
  <span>·</span>
  <a id="quelltext-verweis" href="https://github.com/annichaotica/vokabeltrainer"
     rel="noopener">Quelltext</a>
  <span>·</span>
  <span>Freie Software unter der <abbr title="GNU Affero General Public
     License, Fassung 3 oder später">AGPL-3.0</abbr></span>
</footer>

<div id="meldung" class="meldung" role="status" aria-live="polite" hidden></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
